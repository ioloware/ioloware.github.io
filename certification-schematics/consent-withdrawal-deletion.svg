<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Camera Dashboard consent withdrawal and deletion flow</title>
  <desc id="desc">Two deletion entry paths, automatic Ring disconnect and verified support request, converging on DynamoDB and S3 account-wide deletion and access revocation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569; }
      .lane { font: 700 15px Inter, Arial, sans-serif; fill: #475569; letter-spacing: .05em; }
      .node-title { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .result-title { font: 700 17px Inter, Arial, sans-serif; fill: #065f46; }
      .result-body { font: 400 14px Inter, Arial, sans-serif; fill: #065f46; }
      .edge-label { font: 600 13px Inter, Arial, sans-serif; fill: #1e3a8a; }
      .note { font: 400 14px Inter, Arial, sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .entry-auto { fill: #eff6ff; stroke: #60a5fa; }
      .entry-manual { fill: #f5f3ff; stroke: #a78bfa; }
      .delete { fill: #fff1f2; stroke: #fb7185; }
      .result { fill: #ecfdf5; stroke: #34d399; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .delete-flow { fill: none; stroke: #dc2626; stroke-width: 3; marker-end: url(#arrow-red); }
      .support-flow { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Camera Dashboard — Consent Withdrawal and Data Deletion</text>
  <text x="60" y="94" class="subtitle">Automatic Ring disconnect path and verified privacy-request path</text>

  <text x="60" y="148" class="lane">AUTOMATIC DISCONNECT</text>
  <line x1="60" y1="160" x2="1540" y2="160" stroke="#cbd5e1"/>

  <rect x="60" y="198" width="245" height="118" class="node entry-auto" rx="16"/>
  <text x="86" y="234" class="node-title">1. User disconnects</text>
  <text x="86" y="262" class="node-body">Camera Dashboard in Ring Appstore</text>
  <text x="86" y="286" class="node-body">Ring authorization is withdrawn</text>

  <rect x="370" y="198" width="270" height="118" class="node entry-auto" rx="16"/>
  <text x="396" y="234" class="node-title">2. Ring lifecycle event</text>
  <text x="396" y="262" class="node-body">app_integration_removed</text>
  <text x="396" y="286" class="node-body">HMAC-signed webhook</text>

  <rect x="705" y="198" width="270" height="118" class="node" rx="16"/>
  <text x="731" y="234" class="node-title">3. Verify and dedupe</text>
  <text x="731" y="262" class="node-body">Webhook Lambda validates HMAC</text>
  <text x="731" y="286" class="node-body">Request ID prevents duplicate work</text>

  <rect x="1040" y="198" width="270" height="118" class="node delete" rx="16"/>
  <text x="1066" y="234" class="node-title">4. Delete account data</text>
  <text x="1066" y="262" class="node-body">DynamoDB linked records</text>
  <text x="1066" y="286" class="node-body">S3 account media prefix</text>

  <rect x="1365" y="198" width="175" height="118" class="node result" rx="16"/>
  <text x="1391" y="234" class="result-title">Access ends</text>
  <text x="1391" y="262" class="result-body">Roku calls fail</text>
  <text x="1391" y="286" class="result-body">Returns to pairing</text>

  <path d="M305 257 L370 257" class="flow"/>
  <path d="M640 257 L705 257" class="flow"/>
  <path d="M975 257 L1040 257" class="delete-flow"/>
  <path d="M1310 257 L1365 257" class="delete-flow"/>

  <text x="60" y="390" class="lane">VERIFIED PRIVACY / DELETION REQUEST</text>
  <line x1="60" y1="402" x2="1540" y2="402" stroke="#cbd5e1"/>

  <rect x="60" y="440" width="245" height="130" class="node entry-manual" rx="16"/>
  <text x="86" y="476" class="node-title">1. User contacts Ioloware</text>
  <text x="86" y="504" class="node-body">Website contact form</text>
  <text x="86" y="528" class="node-body">“Privacy Request” or</text>
  <text x="86" y="551" class="node-body">“Data Deletion”</text>

  <rect x="370" y="440" width="270" height="130" class="node entry-manual" rx="16"/>
  <text x="396" y="476" class="node-title">2. Verify account control</text>
  <text x="396" y="504" class="node-body">Use approved Ring-account proof</text>
  <text x="396" y="528" class="node-body">Do not rely on stored email;</text>
  <text x="396" y="551" class="node-body">the app does not retain it</text>

  <rect x="705" y="440" width="270" height="130" class="node" rx="16"/>
  <text x="731" y="476" class="node-title">3. Locate scoped records</text>
  <text x="731" y="504" class="node-body">Opaque Ring account ID</text>
  <text x="731" y="528" class="node-body">Account partition + linked sessions,</text>
  <text x="731" y="551" class="node-body">pairings, devices and media prefix</text>

  <rect x="1040" y="440" width="270" height="130" class="node delete" rx="16"/>
  <text x="1066" y="476" class="node-title">4. Perform deletion</text>
  <text x="1066" y="504" class="node-body">Same DynamoDB + S3 scope</text>
  <text x="1066" y="528" class="node-body">Revoke / rotate tokens if needed</text>
  <text x="1066" y="551" class="node-body">Document the outcome</text>

  <rect x="1365" y="440" width="175" height="130" class="node result" rx="16"/>
  <text x="1391" y="476" class="result-title">Confirm</text>
  <text x="1391" y="504" class="result-body">Respond through</text>
  <text x="1391" y="528" class="result-body">the verified</text>
  <text x="1391" y="551" class="result-body">support channel</text>

  <path d="M305 505 L370 505" class="support-flow"/>
  <path d="M640 505 L705 505" class="support-flow"/>
  <path d="M975 505 L1040 505" class="delete-flow"/>
  <path d="M1310 505 L1365 505" class="delete-flow"/>

  <text x="60" y="660" class="lane">DELETION SCOPE AND BACKSTOPS</text>
  <line x1="60" y1="672" x2="1540" y2="672" stroke="#cbd5e1"/>

  <rect x="60" y="710" width="350" height="142" class="node" rx="16"/>
  <text x="88" y="746" class="node-title">DynamoDB deletion scope</text>
  <text x="88" y="775" class="node-body">OAuth tokens + account metadata</text>
  <text x="88" y="799" class="node-body">Events + latest-event pointers</text>
  <text x="88" y="823" class="node-body">Browser sessions + pairings + Roku devices</text>

  <rect x="455" y="710" width="300" height="142" class="node" rx="16"/>
  <text x="483" y="746" class="node-title">S3 deletion scope</text>
  <text x="483" y="775" class="node-body">All objects under the account prefix</text>
  <text x="483" y="799" class="node-body">Snapshots + on-demand clips</text>
  <text x="483" y="823" class="node-body">Paginated, idempotent DeleteObjects</text>

  <rect x="800" y="710" width="330" height="142" class="node" rx="16"/>
  <text x="828" y="746" class="node-title">Queued event behavior</text>
  <text x="828" y="775" class="node-body">A processor finding no account token</text>
  <text x="828" y="799" class="node-body">drops the event instead of recreating data</text>
  <text x="828" y="823" class="node-body">Retry / DLQ retention remains separate</text>

  <rect x="1175" y="710" width="365" height="142" class="node result" rx="16"/>
  <text x="1203" y="746" class="result-title">Automatic expiry backstop</text>
  <text x="1203" y="775" class="result-body">Event rows: one-day DynamoDB TTL</text>
  <text x="1203" y="799" class="result-body">Snapshots / clips: one-day S3 lifecycle</text>
  <text x="1203" y="823" class="result-body">Pairing code: 15 min • Session: 90 days</text>

  <text x="60" y="902" class="note">Support-request deletion is an operational workflow; the automatic code path is the signed Ring disconnect webhook.</text>
</svg>
