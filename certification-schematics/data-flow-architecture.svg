<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Camera Dashboard data flow and storage architecture</title>
  <desc id="desc">End-to-end flow from Ring authorization and signed event webhooks through AWS Lambda, SQS, DynamoDB, S3, and the paired Roku application.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569; }
      .boundary-label { font: 700 17px Inter, Arial, sans-serif; fill: #1d4ed8; letter-spacing: .04em; }
      .node-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .edge-label { font: 600 13px Inter, Arial, sans-serif; fill: #1e3a8a; }
      .edge-label-muted { font: 600 13px Inter, Arial, sans-serif; fill: #475569; }
      .legend { font: 400 13px Inter, Arial, sans-serif; fill: #475569; }
      .step { font: 700 14px Inter, Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .control { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-muted); }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .node-ring { fill: #eff6ff; stroke: #60a5fa; }
      .node-roku { fill: #f5f3ff; stroke: #a78bfa; }
      .node-data { fill: #ecfdf5; stroke: #34d399; }
      .node-security { fill: #fff7ed; stroke: #fb923c; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Camera Dashboard — Data Flow and Storage Architecture</text>
  <text x="60" y="94" class="subtitle">Current implementation: Ring Partner API → AWS serverless backend → authorized Roku device</text>

  <rect x="400" y="132" width="820" height="760" rx="24" fill="#eef6ff" fill-opacity="0.55" stroke="#60a5fa" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="430" y="166" class="boundary-label">CAMERA DASHBOARD AWS TRUST BOUNDARY</text>

  <rect x="50" y="150" width="290" height="118" class="node" rx="16"/>
  <text x="78" y="184" class="node-title">Ring user</text>
  <text x="78" y="211" class="node-body">Initiates connection in Ring Appstore</text>
  <text x="78" y="233" class="node-body">Authenticates directly with Ring</text>
  <text x="78" y="255" class="node-body">Selects recordings for playback</text>

  <rect x="50" y="352" width="290" height="194" class="node node-ring" rx="16"/>
  <text x="78" y="388" class="node-title">Ring cloud</text>
  <text x="78" y="417" class="node-body">OAuth tokens and opaque account ID</text>
  <text x="78" y="441" class="node-body">Camera IDs and names</text>
  <text x="78" y="465" class="node-body">HMAC-signed motion / doorbell events</text>
  <text x="78" y="489" class="node-body">Snapshots and recorded MP4 clips</text>
  <text x="78" y="520" class="node-body">No Ring password sent to the app</text>

  <rect x="1270" y="410" width="280" height="204" class="node node-roku" rx="16"/>
  <text x="1298" y="446" class="node-title">Camera Dashboard on Roku</text>
  <text x="1298" y="475" class="node-body">Stores random device token locally</text>
  <text x="1298" y="499" class="node-body">Lists recent event metadata</text>
  <text x="1298" y="523" class="node-body">Displays presigned snapshot URLs</text>
  <text x="1298" y="547" class="node-body">Requests a clip only when selected</text>
  <text x="1298" y="578" class="node-body">Bearer-authenticated HTTPS API</text>

  <rect x="450" y="202" width="210" height="104" class="node" rx="16"/>
  <text x="475" y="237" class="node-title">Webhook Lambda</text>
  <text x="475" y="265" class="node-body">Verify HMAC • dedupe</text>
  <text x="475" y="287" class="node-body">Handle disconnect event</text>

  <rect x="725" y="202" width="210" height="104" class="node" rx="16"/>
  <text x="750" y="237" class="node-title">Amazon SQS</text>
  <text x="750" y="265" class="node-body">Event queue</text>
  <text x="750" y="287" class="node-body">Retry + dead-letter queue</text>

  <rect x="1000" y="202" width="180" height="104" class="node" rx="16"/>
  <text x="1025" y="237" class="node-title">Processor Lambda</text>
  <text x="1025" y="265" class="node-body">Fetch snapshot</text>
  <text x="1025" y="287" class="node-body">Store recent event</text>

  <rect x="715" y="428" width="245" height="126" class="node" rx="16"/>
  <text x="744" y="466" class="node-title">API Lambda</text>
  <text x="744" y="494" class="node-body">OAuth + browser/Roku pairing</text>
  <text x="744" y="518" class="node-body">List events • presign media</text>
  <text x="744" y="542" class="node-body">Fetch selected MP4 on demand</text>

  <rect x="460" y="650" width="235" height="126" class="node node-data" rx="16"/>
  <text x="488" y="687" class="node-title">Amazon DynamoDB</text>
  <text x="488" y="715" class="node-body">Tokens • camera names • events</text>
  <text x="488" y="739" class="node-body">Sessions • pairing • Roku devices</text>
  <text x="488" y="763" class="node-body">Event TTL: 1 day</text>

  <rect x="760" y="650" width="235" height="126" class="node node-data" rx="16"/>
  <text x="788" y="687" class="node-title">Private Amazon S3</text>
  <text x="788" y="715" class="node-body">Event snapshots</text>
  <text x="788" y="739" class="node-body">On-demand MP4 clips</text>
  <text x="788" y="763" class="node-body">Lifecycle expiry: 1 day</text>

  <rect x="1040" y="650" width="140" height="126" class="node node-security" rx="16"/>
  <text x="1062" y="687" class="node-title">AWS SSM</text>
  <text x="1062" y="715" class="node-body">SecureString</text>
  <text x="1062" y="739" class="node-body">Client secret</text>
  <text x="1062" y="763" class="node-body">HMAC key</text>

  <rect x="570" y="816" width="470" height="58" class="node" rx="14"/>
  <text x="597" y="850" class="node-title">Amazon CloudWatch — operational logs and errors; no media content</text>

  <path d="M195 268 L195 352" class="flow"/>
  <circle cx="219" cy="310" r="15" fill="#2563eb"/><text x="219" y="310" class="step">1</text>
  <text x="238" y="292" class="edge-label">OAuth authorization</text>

  <path d="M340 426 L450 254" class="flow"/>
  <circle cx="405" cy="365" r="15" fill="#2563eb"/><text x="405" y="365" class="step">2</text>
  <text x="348" y="333" class="edge-label">Signed event</text>

  <path d="M660 254 L725 254" class="flow"/>
  <circle cx="692" cy="231" r="15" fill="#2563eb"/><text x="692" y="231" class="step">3</text>

  <path d="M935 254 L1000 254" class="flow"/>
  <circle cx="967" cy="231" r="15" fill="#2563eb"/><text x="967" y="231" class="step">4</text>

  <path d="M340 454 C560 330 920 350 1000 282" class="flow"/>
  <text x="617" y="375" class="edge-label">Download snapshot from Ring</text>

  <path d="M1065 306 C1010 370 705 348 630 420 L620 650" class="flow"/>
  <text x="744" y="347" class="edge-label">Event metadata</text>
  <path d="M1103 306 C1100 395 1010 520 916 650" class="flow"/>
  <text x="1022" y="425" class="edge-label">JPEG snapshot</text>

  <path d="M340 500 L715 490" class="flow"/>
  <circle cx="515" cy="473" r="15" fill="#2563eb"/><text x="515" y="473" class="step">5</text>
  <text x="455" y="449" class="edge-label">OAuth / Ring APIs</text>

  <path d="M1270 490 L960 490" class="flow"/>
  <path d="M960 528 L1270 548" class="flow"/>
  <circle cx="1128" cy="466" r="15" fill="#2563eb"/><text x="1128" y="466" class="step">6</text>
  <text x="1043" y="450" class="edge-label">List / play request</text>
  <text x="1038" y="576" class="edge-label">Metadata + expiring media URL</text>

  <path d="M790 554 L650 650" class="flow"/>
  <path d="M870 554 L870 650" class="flow"/>
  <text x="694" y="611" class="edge-label">Read / write</text>

  <path d="M340 510 C420 570 570 575 715 520" class="flow"/>
  <text x="438" y="596" class="edge-label">Selected MP4 only</text>

  <path d="M1040 712 L960 518" class="control"/>
  <path d="M1040 696 L660 270" class="control"/>
  <path d="M1100 650 L1092 306" class="control"/>
  <text x="954" y="622" class="edge-label-muted">Credentials</text>

  <path d="M545 306 L650 816" class="control"/>
  <path d="M830 306 L735 816" class="control"/>
  <path d="M1090 306 L875 816" class="control"/>
  <path d="M836 554 L940 816" class="control"/>

  <path d="M340 390 C385 306 410 274 450 274" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <circle cx="350" cy="305" r="15" fill="#dc2626"/><text x="350" y="305" class="step">7</text>
  <text x="60" y="332" class="edge-label-muted">Disconnect → account-wide deletion</text>

  <line x1="60" y1="938" x2="120" y2="938" class="flow"/>
  <text x="132" y="943" class="legend">Customer, event, and media data flow</text>
  <line x1="450" y1="938" x2="510" y2="938" class="control"/>
  <text x="522" y="943" class="legend">Credentials, controls, and operational logging</text>
  <text x="1030" y="943" class="legend">S3 is private; links expire after 15 minutes (snapshots) or 1 hour (clips).</text>
</svg>
