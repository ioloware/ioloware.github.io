<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Camera Dashboard operational data flow</title>
  <desc id="desc">Two simple workflows show how Ring events reach an authorized Roku and how a selected recording is fetched for playback. Pairing and disconnect controls are summarized below.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569; }
      .lane-label { font: 700 14px Inter, Arial, sans-serif; fill: #1d4ed8; letter-spacing: .10em; }
      .node-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-body { font: 400 14px Inter, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .band-title { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .band-body { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .footer { font: 400 13px Inter, Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .ring { fill: #eff6ff; stroke: #60a5fa; }
      .store { fill: #ecfdf5; stroke: #34d399; }
      .roku { fill: #f5f3ff; stroke: #a78bfa; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="55" y="58" class="title">Camera Dashboard — Operational Data Flow</text>
  <text x="55" y="90" class="subtitle">Two workflows: event delivery and on-demand playback</text>

  <rect x="40" y="122" width="1520" height="230" rx="22" fill="#eff6ff" fill-opacity="0.62" stroke="#bfdbfe"/>
  <text x="60" y="151" class="lane-label">EVENT DELIVERY</text>

  <path d="M270 237 L307 237" class="flow"/>
  <path d="M525 237 L562 237" class="flow"/>
  <path d="M780 237 L817 237" class="flow"/>
  <path d="M1035 237 L1072 237" class="flow"/>
  <path d="M1290 237 L1327 237" class="flow"/>

  <rect x="55" y="174" width="215" height="126" rx="16" class="node ring"/>
  <text x="162.5" y="211" class="node-title">Ring event</text>
  <text x="162.5" y="242" class="node-body">Signed motion or</text>
  <text x="162.5" y="264" class="node-body">doorbell notice</text>

  <rect x="310" y="174" width="215" height="126" rx="16" class="node"/>
  <text x="417.5" y="211" class="node-title">Webhook</text>
  <text x="417.5" y="242" class="node-body">Verify signature</text>
  <text x="417.5" y="264" class="node-body">Dedupe event</text>

  <rect x="565" y="174" width="215" height="126" rx="16" class="node"/>
  <text x="672.5" y="211" class="node-title">Amazon SQS</text>
  <text x="672.5" y="242" class="node-body">Queue and retry</text>
  <text x="672.5" y="264" class="node-body">Isolate failures</text>

  <rect x="820" y="174" width="215" height="126" rx="16" class="node"/>
  <text x="927.5" y="211" class="node-title">Processor</text>
  <text x="927.5" y="242" class="node-body">Fetch snapshot</text>
  <text x="927.5" y="264" class="node-body">Create event record</text>

  <rect x="1075" y="174" width="215" height="126" rx="16" class="node store"/>
  <text x="1182.5" y="211" class="node-title">Private storage</text>
  <text x="1182.5" y="242" class="node-body">Metadata + snapshot</text>
  <text x="1182.5" y="264" class="node-body">Expire after 1 day</text>

  <rect x="1330" y="174" width="215" height="126" rx="16" class="node roku"/>
  <text x="1437.5" y="211" class="node-title">API + Roku</text>
  <text x="1437.5" y="242" class="node-body">Authenticated list</text>
  <text x="1437.5" y="264" class="node-body">and preview</text>

  <rect x="40" y="380" width="1520" height="230" rx="22" fill="#f5f3ff" fill-opacity="0.62" stroke="#ddd6fe"/>
  <text x="60" y="409" class="lane-label">ON-DEMAND PLAYBACK</text>

  <path d="M270 495 L307 495" class="flow"/>
  <path d="M525 495 L562 495" class="flow"/>
  <path d="M780 495 L817 495" class="flow"/>
  <path d="M1035 495 L1072 495" class="flow"/>
  <path d="M1290 495 L1327 495" class="flow"/>

  <rect x="55" y="432" width="215" height="126" rx="16" class="node roku"/>
  <text x="162.5" y="469" class="node-title">Roku selection</text>
  <text x="162.5" y="500" class="node-body">User chooses a</text>
  <text x="162.5" y="522" class="node-body">recording</text>

  <rect x="310" y="432" width="215" height="126" rx="16" class="node"/>
  <text x="417.5" y="469" class="node-title">API Lambda</text>
  <text x="417.5" y="500" class="node-body">Authorize device</text>
  <text x="417.5" y="522" class="node-body">Look up event</text>

  <rect x="565" y="432" width="215" height="126" rx="16" class="node ring"/>
  <text x="672.5" y="469" class="node-title">Ring API</text>
  <text x="672.5" y="500" class="node-body">Fetch recording</text>
  <text x="672.5" y="522" class="node-body">only when selected</text>

  <rect x="820" y="432" width="215" height="126" rx="16" class="node store"/>
  <text x="927.5" y="469" class="node-title">Private S3</text>
  <text x="927.5" y="500" class="node-body">Store selected MP4</text>
  <text x="927.5" y="522" class="node-body">Expire after 1 day</text>

  <rect x="1075" y="432" width="215" height="126" rx="16" class="node"/>
  <text x="1182.5" y="469" class="node-title">Presigned HTTPS</text>
  <text x="1182.5" y="500" class="node-body">One-hour clip URL</text>
  <text x="1182.5" y="522" class="node-body">No public bucket</text>

  <rect x="1330" y="432" width="215" height="126" rx="16" class="node roku"/>
  <text x="1437.5" y="469" class="node-title">Roku playback</text>
  <text x="1437.5" y="500" class="node-body">Stream selected</text>
  <text x="1437.5" y="522" class="node-body">recording</text>

  <rect x="55" y="646" width="725" height="144" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="82" y="681" class="band-title">Secure pairing</text>
  <text x="82" y="712" class="band-body">Ring OAuth browser session • 15-minute single-use code</text>
  <text x="82" y="738" class="band-body">Separate 256-bit polling secret • 256-bit Roku bearer token</text>
  <text x="82" y="764" class="band-body">All requests use HTTPS; pairing claims and polling are rate-limited</text>

  <rect x="820" y="646" width="725" height="144" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="847" y="681" class="band-title">Two disconnect scopes</text>
  <text x="847" y="712" class="band-body">Roku channel: removes one device credential and its local state</text>
  <text x="847" y="738" class="band-body">Ring Appstore: revokes the account and deletes tokens, events, media,</text>
  <text x="847" y="764" class="band-body">sessions, and pairing records</text>

  <text x="800" y="840" class="footer">AWS services: Lambda, SQS, DynamoDB, private S3, SSM Parameter Store, and CloudWatch</text>
</svg>
